[project]
name = "rfmc"
version = "0.1.0"
description = "RF modulation classification with open-set rejection and a hardened serving layer"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "production: release-gate tests that must pass before deploy",
]
